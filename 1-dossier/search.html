<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#ff4500">
    <meta name="description" content="نتائج البحث - Anime Garden">
    <title>نتائج البحث - Anime Garden</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <a class="skip-link" href="#main-content">تخطي إلى المحتوى</a>
    
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-top">
                <div class="logo">
                    <a href="index.html">
                        <h1>Anime Garden</h1>
                        <span>بوابة الأنمي والمانجا العربية</span>
                    </a>
                </div>
                <div class="header-actions">
                    <button id="dark-mode-toggle" class="dark-mode-toggle" aria-pressed="false" aria-label="تبديل الوضع الداكن">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                    <button class="search-toggle" aria-label="فتح البحث">
                        <i class="fas fa-search" aria-hidden="true"></i>
                    </button>
                    <button class="mobile-menu-toggle" aria-label="قائمة الهاتف المتحرك">
                        <i class="fas fa-bars" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="news.html">أخبار</a></li>
                    <li><a href="about.html">عن الموقع</a></li>
                    <li><a href="contact.html">اتصل بنا</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Search Overlay -->
    <div class="search-overlay">
        <div class="search-container">
            <button class="close-search">
                <i class="fas fa-times"></i>
            </button>
            <form class="search-form">
                <input type="text" name="q" placeholder="ابحث في الأنمي، المانجا، الأخبار..." dir="rtl" aria-label="بحث الموقع">
                <button type="submit" aria-label="إرسال بحث">
                    <i class="fas fa-search" aria-hidden="true"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1>نتائج البحث</h1>
            <p id="search-query"></p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        <div class="container">
            <div id="search-results" style="text-align: center; padding: 2rem;">
                <p style="font-size: 1.1rem; color: var(--text-light);">جاري تحميل النتائج...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <div class="footer-column">
                    <h4>روابط سريعة</h4>
                    <ul>
                        <li><a href="index.html">الرئيسية</a></li>
                        <li><a href="news.html">الأخبار</a></li>
                        <li><a href="about.html">عن الموقع</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h4>اتبعنا</h4>
                    <div class="social-links">
                        <a href="#"><i class="fab fa-twitter"></i></a>
                        <a href="#"><i class="fab fa-instagram"></i></a>
                        <a href="#"><i class="fab fa-youtube"></i></a>
                        <a href="#"><i class="fab fa-facebook"></i></a>
                    </div>
                </div>
            </div>

            <div class="footer-bottom">
                <p>&copy; 2025 Anime Garden. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <script src="js/dark-mode.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/script.js" defer></script>
</body>
</html>
